name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: sigops-agent

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            ext: ""
            cross: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            ext: ""
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-13
            ext: ""
            cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            ext: ""
            cross: false
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            ext: ".exe"
            cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (cargo)
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: runner.os != 'Windows' && matrix.target != 'aarch64-unknown-linux-musl'
        run: strip target/${{ matrix.target }}/release/${{ env.BIN_NAME }}${{ matrix.ext }}

      - name: Prepare artifact directory
        shell: bash
        run: |
          set -eux
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/${{ env.BIN_NAME }}${{ matrix.ext }}"
          OUT="dist/${{ env.BIN_NAME }}-${{ matrix.target }}${{ matrix.ext }}"
          cp "$BIN" "$OUT"

      - name: SHA256 checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eux
          cd dist
          FILE="${{ env.BIN_NAME }}-${{ matrix.target }}${{ matrix.ext }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$FILE" > "${FILE}.sha256"
          else
            shasum -a 256 "$FILE" > "${FILE}.sha256"
          fi

      - name: SHA256 checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location dist
          $file = "${{ env.BIN_NAME }}-${{ matrix.target }}${{ matrix.ext }}"
          $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
          "$hash  $file" | Out-File -Encoding ascii "$file.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: |
            dist/${{ env.BIN_NAME }}-${{ matrix.target }}${{ matrix.ext }}
            dist/${{ env.BIN_NAME }}-${{ matrix.target }}${{ matrix.ext }}.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect artifacts and combined checksum
        run: |
          set -eux
          mkdir -p release
          find artifacts -type f \( -name "${BIN_NAME}-*" ! -name "*.sha256" \) -exec cp {} release/ \;
          find artifacts -type f -name "*.sha256" -exec cat {} + > release/checksums.txt
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
